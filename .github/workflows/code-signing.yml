name: Code Signing

on:
  push:
    branches:
      - main
    paths:
      - "Functions/**"
      - "Scripts/**"
      - "OneOffs/**"
      - "LoadFunctions.txt"

  workflow_dispatch:

permissions:
  contents: write

# Only one signing run at a time per branch.
#
# Two merges landing close together used to race: the first run checked out main, signed,
# committed, then found main had already moved and its push was rejected non-fast-forward.
# Its signatures were dropped on the floor and the run failed. Serialising means each run
# checks out a main that already carries the previous run's signature commit.
#
# cancel-in-progress is false so an in-flight run is never killed part way through signing.
# If several merges land at once GitHub keeps only the newest pending run and cancels the
# rest, which is safe here: Sign-Scripts.ps1 signs every script in the repository, not just
# the ones a given push changed, so the surviving run covers the cancelled ones' files too.
concurrency:
  group: code-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-scripts:
    name: Sign PowerShell Scripts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign scripts with Azure Key Vault certificate
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_VAULT_NAME: ${{ secrets.AZURE_VAULT_NAME }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          $secureSecret = ConvertTo-SecureString -String $env:AZURE_CLIENT_SECRET -AsPlainText -Force
          .\Sign-Scripts.ps1 `
            -VaultName $env:AZURE_VAULT_NAME `
            -CertName $env:AZURE_CERT_NAME `
            -TenantId $env:AZURE_TENANT_ID `
            -ClientId $env:AZURE_CLIENT_ID `
            -ClientSecret $secureSecret `
            -RepoRoot '${{ github.workspace }}'

      # NOTE: If branch protection is enabled on main, the GITHUB_TOKEN may not
      # have permission to push. In that case, either allow Actions to bypass
      # branch protection, or use a PAT stored as a separate secret for the token.
      - name: Commit signed scripts
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $changes = git diff --name-only HEAD
          if (-not $changes) {
            Write-Host "No signing changes to commit."
            exit 0
          }

          git add -- $changes
          git commit -m "chore: apply Authenticode signatures to scripts [skip ci]"
          if ($LASTEXITCODE -ne 0) {
            throw "git commit failed with exit code $LASTEXITCODE."
          }

          git push
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Signed scripts committed and pushed."
            exit 0
          }

          # Do NOT "fix" a rejected push by rebasing onto the new main and pushing again.
          # This commit only rewrites signature blocks, and each block is computed over the
          # file contents THIS run checked out. A rebase would replay those blocks on top of
          # someone else's newer file contents, and git would merge them cleanly because the
          # two changes touch different parts of the file. The result is a well-formed
          # Authenticode block over content that no longer matches it: a signature that is
          # silently invalid, which is worse than an unsigned file.
          #
          # The only safe recovery is to sign again from the current main. The next push to
          # main does that automatically; to do it now, use "Run workflow" on this workflow.
          Write-Host "::error::Push rejected. main moved while this run was signing, so these signatures are stale and were not published. Re-run this workflow against the current main."
          throw "git push failed with exit code $LASTEXITCODE."
